; v2b-demo 的 PHP 配置（fpm 与 cli 共用）
; opcache 保持官方镜像默认（fpm 启用、cli 关闭）。不要设 opcache.enable=0：
; "加载但未启用"时 opcache_reset() 返回 false，后台保存配置会直接 500。

; 4096 与常见生产 php.ini 一致；设为 On 表示不限制（跨域 CSV 导出才能保留 CORS 头）。
; 由 compose 传入环境变量 PHP_OUTPUT_BUFFERING。
output_buffering = ${PHP_OUTPUT_BUFFERING}

memory_limit = 512M
post_max_size = 16M
upload_max_filesize = 16M
max_execution_time = 60

; Laravel 8 在 PHP 8.2 上会产生弃用告警，直接输出会污染 JSON 响应
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off

date.timezone = Asia/Shanghai
